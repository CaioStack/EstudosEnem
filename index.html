<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudos Enem</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="js/data-loader.js"></script>
    <script src="js/render-questao.js"></script>
    <script src="js/render-materia.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="marca">
        <span class="marca-ponto"></span>
        <span>Estudos Enem</span>
      </div>

      <nav class="menu-lateral" id="abas-materias">
        <button class="menu-item ativa" data-materia="linguagens">Linguagens</button>
        <button class="menu-item" data-materia="humanas">Ciências Humanas</button>
        <button class="menu-item" data-materia="natureza">Ciências da Natureza</button>
        <button class="menu-item" data-materia="matematica">Matemática</button>
        <button class="menu-item" data-materia="redacao">Redação</button>
        <button class="menu-item" data-materia="simulados">Simulados</button>
      </nav>

      <button id="toggle-tema" class="botao-tema">Alternar tema</button>
    </aside>

    <div class="area-principal">
      <header class="topo-mobile">
        <button id="abrir-menu" aria-label="Abrir menu">☰</button>
        <span>Estudos Enem</span>
      </header>

      <main id="conteudo-principal">
        <section id="painel-materia">
          <p>Selecione uma matéria ao lado.</p>
        </section>
        <section id="painel-simulados" hidden></section>
      </main>

      <footer>
        <p>Estudos Enem — desenvolvido por Caio Salgado Marques</p>
      </footer>
    </div>
  </div>

  <!-- scripts na mesma ordem da v0.6 -->
</body>
</html>
