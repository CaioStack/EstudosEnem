<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="UTF-8">
  <title>Curadoria de questões — uso interno</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <main>
    <h1>Curadoria de questões (uso interno)</h1>
    <p>Escolha o ano e a disciplina, encontre a questão certa e copie a referência.</p>

    <div class="filtros-curadoria">
      <label>Ano: <input type="number" id="filtro-ano" value="2023" min="2009" max="2024"></label>
      <label>Disciplina:
        <select id="filtro-disciplina">
          <option value="linguagens">Linguagens</option>
          <option value="ciencias-humanas">Ciências Humanas</option>
          <option value="ciencias-natureza">Ciências da Natureza</option>
          <option value="matematica">Matemática</option>
        </select>
      </label>
      <button id="buscar-curadoria-btn">Buscar</button>
    </div>

    <div id="resultado-curadoria"></div>
  </main>

  <script src="../js/enem-api.js"></script>
  <script src="../js/curadoria.js"></script>
</body>
</html>
