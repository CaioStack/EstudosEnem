<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Simulado — Estudos ENEM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-simulado">
  <header class="topo-pagina">
    <a href="../index.html#simulados" class="voltar">
      ← Voltar aos simulados
    </a>

    <button
      type="button"
      class="botao-tema"
      data-acao="tema"
    >
      Alternar tema
    </button>
  </header>

  <main>
    <section class="simulado-hero">
      <p class="eyebrow">Simulado oficial</p>
      <h1 id="titulo-simulado">Simulado</h1>

      <div class="simulado-resumo">
        <div>
          <span>Ano</span>
          <strong id="simulado-ano">—</strong>
        </div>

        <div>
          <span>Questões objetivas</span>
          <strong id="total-questoes">—</strong>
        </div>

        <div>
          <span>Redação</span>
          <strong id="total-redacao">—</strong>
        </div>
      </div>

      <div
        id="status-carregamento"
        class="status-api"
        role="status"
        aria-live="polite"
      >
        <span class="spinner"></span>
        Preparando simulado...
      </div>
    </section>

    <section class="bloco-dia">
      <div class="bloco-cabecalho">
        <div>
          <p class="eyebrow">Primeiro dia</p>
          <h2>Linguagens e Ciências Humanas</h2>
        </div>
        <span id="total-dia-1">—</span>
      </div>

      <div
        id="questoes-dia-1"
        class="lista-questoes"
        aria-live="polite"
      ></div>
    </section>

    <section class="bloco-dia">
      <div class="bloco-cabecalho">
        <div>
          <p class="eyebrow">Segundo dia</p>
          <h2>Ciências da Natureza e Matemática</h2>
        </div>
        <span id="total-dia-2">—</span>
      </div>

      <div
        id="questoes-dia-2"
        class="lista-questoes"
        aria-live="polite"
      ></div>
    </section>

    <section class="bloco-dia bloco-redacao">
      <div class="bloco-cabecalho">
        <div>
          <p class="eyebrow">Produção textual</p>
          <h2>Redação</h2>
        </div>
      </div>

      <div id="area-redacao"></div>
    </section>

    <section class="bloco-dia bloco-gabarito">
      <div class="bloco-cabecalho">
        <div>
          <p class="eyebrow">Após responder</p>
          <h2>Gabarito geral</h2>
        </div>
      </div>

      <button
        type="button"
        id="mostrar-gabarito-btn"
        class="ver-resposta-btn"
      >
        Mostrar gabarito geral
      </button>

      <div
        id="gabarito-geral"
        class="gabarito-geral"
        hidden
      ></div>
    </section>
  </main>

  <script src="../js/enem-api.js"></script>
  <script src="../js/render-questao.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/render-simulado-pagina.js"></script>
</body>
</html>
